# /etc/nginx/sites-available/nobitex-dashboard.conf
# ALTERNATIVE to the Caddyfile in this folder (Caddy was the chosen one). Keep
# this file only if you install nginx instead.
#
#   sudo openssl req -x509 -newkey rsa:2048 -nodes -days 825 \
#        -keyout /etc/nginx/tls/nobitex.key -out /etc/nginx/tls/nobitex.crt \
#        -subj "/CN=v42.ir" -addext "subjectAltName=DNS:v42.ir,IP:185.165.30.181"
#   sudo htpasswd -c /etc/nginx/.htpasswd-nobitex ops      # apache2-utils
#   sudo ln -s /etc/nginx/sites-available/nobitex-dashboard.conf \
#              /etc/nginx/sites-enabled/nobitex-dashboard.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Public entry point: https://v42.ir:8787  — the bot stays on 127.0.0.1:8787.
# Binding the public IP on the same port does NOT collide with the bot's
# loopback socket. There is no port-80 block on purpose: port 80 belongs to
# another service on this box, so there is no HTTP-to-HTTPS redirect — always
# type the https:// URL.

server {
    listen 185.165.30.181:8787 ssl;      # public interface only
    server_name v42.ir;

    ssl_certificate     /etc/nginx/tls/nobitex.crt;
    ssl_certificate_key /etc/nginx/tls/nobitex.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # ------------------------------------------------------------ layer 1
    auth_basic "Nobitex dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-nobitex;

    # optional allow-list: only your own addresses may even see the prompt
    # allow 1.2.3.4;
    # deny all;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # REQUIRED: the dashboard's CSRF guard compares Origin with the Host it
        # was reached on. nginx's default is $proxy_host (127.0.0.1:8787), and
        # then every POST (login, save settings, start/stop) answers 403.
        # $http_host keeps the browser's value including the :8787 port so the
        # Origin netloc matches exactly.
        proxy_set_header Host $http_host;

        # REQUIRED for HTTPS: without it the session cookie is not Secure.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        proxy_read_timeout 120s;
    }
}
