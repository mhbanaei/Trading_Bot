<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود به داشبورد ربات</title>
<style>
:root{
  --bg:#0b0f17; --panel:#111827; --panel2:#0e1522; --border:#1f2a3a;
  --text:#e5edf8; --muted:#8b9bb4; --accent:#10cf89; --green:#10cf89;
  --on-accent:#04231a;
  --red:#ef4444; --orange:#f59e0b; --cyan:#22d3ee;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--text); min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:18px;
  font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif; font-size:14px}
.card{background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:22px; width:100%; max-width:420px}
h1{font-size:17px; margin-bottom:4px}
.muted{color:var(--muted); font-size:12.5px; line-height:1.7}
label{display:block; font-size:12.5px; color:var(--muted); margin:14px 0 6px}
input{width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--border);
  border-radius:8px; padding:10px 12px; font-family:inherit; font-size:15px; direction:ltr}
input:focus{outline:none; border-color:var(--accent)}
button{width:100%; margin-top:14px; background:var(--accent); color:var(--on-accent); border:1px solid var(--accent);
  border-radius:8px; padding:11px 14px; cursor:pointer; font-family:inherit; font-size:14px; font-weight:700}
button:disabled{opacity:.55; cursor:not-allowed}
.msg{margin-top:12px; font-size:13px; line-height:1.8; display:none; border-radius:8px;
  padding:9px 12px; border:1px solid var(--border); background:var(--panel2)}
.msg.err{color:var(--red); border-color:#7f1d1d; background:#450a0a}
.msg.ok{color:var(--green); border-color:#14532d; background:#052e16}
.msg.warn{color:var(--orange); border-color:#7c2d12; background:#431407}
</style>
</head>
<body>
<div class="card">
  <h1>🤖 ورود به داشبورد ربات</h1>
  <div class="muted">برای ادامه، پسورد دسترسی را وارد کنید.</div>
  <form id="loginForm" autocomplete="off">
    <label for="pw">پسورد داشبورد</label>
    <input id="pw" type="password" dir="ltr" autocomplete="current-password" autofocus>
    <button id="btnLogin" type="submit">ورود</button>
  </form>
  <div id="msg" class="msg"></div>
</div>
<script>
"use strict";
const pw=document.getElementById("pw"), msg=document.getElementById("msg"),
      btn=document.getElementById("btnLogin"), form=document.getElementById("loginForm");
let status={password_set:true,locked:false,lock_seconds_left:0,attempts_left:3,max_attempts:3};
let tick=null;
function show(text,kind){ msg.className="msg "+(kind||""); msg.innerHTML=text; msg.style.display="block"; }
function hide(){ msg.style.display="none"; }
function fmtLeft(s){ s=Math.max(0,Math.round(s));
  const m=Math.floor(s/60), r=s%60;
  return m>0 ? (m+" دقیقه و "+r+" ثانیه") : (r+" ثانیه"); }
function applyState(){
  if(!status.password_set){
    btn.disabled=true;
    show("ورود در حال حاضر امکان‌پذیر نیست.","warn");
    return;
  }
  if(status.locked){
    btn.disabled=true; pw.disabled=true;
    const secs=status.lock_seconds_left||0;
    if(secs>0){
      show("دسترسی موقتاً قفل شد (پسورد "+(status.max_attempts||3)+" بار اشتباه). "+fmtLeft(secs)+" دیگر دوباره امتحان کنید.","err");
      if(tick)clearInterval(tick);
      tick=setInterval(()=>{ status.lock_seconds_left-=1; applyState(); },1000);
    }else{
      if(tick){clearInterval(tick);tick=null}
      show("دسترسی قفل شده است. تا زمانی که مدیر دسترسی را بازنشانی نکند، ورود ممکن نیست.","err");
    }
    return;
  }
  if(tick){clearInterval(tick);tick=null}
  pw.disabled=false; btn.disabled=false;
  const used=status.fail_count||0;
  if(used>0){
    const left=Math.max(0,(status.max_attempts||3)-used);
    show("تا اینجا "+used+" پسورد اشتباه وارد شده — "+left+" تلاش باقی مانده.","warn");
  }else hide();
}
async function loadStatus(){
  try{
    const r=await fetch("/api/auth/status",{cache:"no-store"});
    if(r.ok){ status=await r.json();
      if(status.authenticated){ location.href="/"; return; } }
  }catch(e){}
  applyState();
}
form.addEventListener("submit",async e=>{
  e.preventDefault();
  if(!pw.value){ show("پسورد را وارد کنید.","warn"); return; }
  btn.disabled=true;
  try{
    const r=await fetch("/api/auth/login",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password:pw.value})});
    let d={}; try{ d=await r.json(); }catch(_){}
    if(r.ok&&d.ok){
      show("ورود موفق — در حال باز کردن داشبورد…","ok");
      location.href="/";
      return;
    }
    pw.value="";
    status.locked=!!d.locked;
    status.lock_seconds_left=d.lock_seconds_left||0;
    status.max_attempts=d.max_attempts||status.max_attempts;
    status.attempts_left=(d.attempts_left!=null?d.attempts_left:status.attempts_left);
    if(d.status==="NO_PASSWORD"){ status.password_set=false; applyState(); return; }
    if(status.locked){
      if(status.lock_seconds_left>0) status.lock_seconds_left+=1; /* تا شمارش بعدی */
      applyState();
      return;
    }
    /* the server message already carries the remaining-attempts count */
    show(d.message||("پسورد اشتباه است — "+status.attempts_left+" تلاش باقی مانده."),"err");
    pw.focus();
  }catch(err){
    show("ارتباط با سرور برقرار نشد: "+(err&&err.message?err.message:err),"err");
  }
  if(!status.locked) btn.disabled=false;
});
loadStatus();
</script>
</body>
</html>
